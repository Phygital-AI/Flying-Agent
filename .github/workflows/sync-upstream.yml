name: Sync from LZR-S/Flying-Agent

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Merge upstream and transfer LFS assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/LZR-S/Flying-Agent.git
          git fetch --no-tags upstream main
          git merge --no-edit FETCH_HEAD
          git lfs fetch upstream main
          git lfs push origin HEAD
          git push origin HEAD:main
